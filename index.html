<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dynasty Hub</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      --bg: #edf1f5;
      --panel: #f6f8fb;
      --card: #ffffff;
      --card-alt: #f2f6fb;
      --ink: #1d2430;
      --muted: #607084;
      --line: #d9e0ea;
      --navy: #12253d;
      --navy-2: #0b1b2d;
      --red: #d9272e;
      --red-soft: #fbe7e9;
      --green: #1a7c5b;
      --green-soft: #e6f7f0;
      --gold: #d9a53f;
      --shadow: 0 10px 28px rgba(18, 31, 46, 0.08);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #edf1f5 0%, #e5eaf0 100%);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .topbar {
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
      border-bottom: 3px solid var(--red);
      box-shadow: 0 8px 18px rgba(11, 27, 45, 0.18);
      margin: 0 0 20px;
    }

    .topbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ffd97c, #d9972a);
      color: var(--navy-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.8rem;
    }

    .status-box {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 14px;
      min-width: 220px;
      color: rgba(255,255,255,0.92);
    }

    .status-label {
      display: block;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.64);
    }

    .status-value {
      display: block;
      margin-top: 4px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .page-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px 36px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .league-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--red-soft);
      color: var(--red);
      border: 1px solid rgba(217, 39, 46, 0.12);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.055em;
      color: var(--navy-2);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .metric-card {
      background: linear-gradient(180deg, #ffffff 0%, #f2f7fb 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px 16px;
    }

    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .metric-value {
      display: block;
      margin-top: 8px;
      font-size: clamp(1.15rem, 2vw, 1.75rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--navy);
    }

    .metric-note {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.3;
    }

    .tabs-wrap {
      margin-bottom: 18px;
    }

    #tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .tab {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--navy);
      padding: 11px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab:hover {
      transform: translateY(-1px);
    }

    .tab.on {
      background: linear-gradient(135deg, var(--navy) 0%, #203a66 100%);
      border-color: transparent;
      color: white;
      box-shadow: 0 10px 18px rgba(18, 37, 61, 0.15);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .table-card {
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f3f6fa;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: left;
      padding: 12px 14px;
    }

    td {
      padding: 13px 14px;
      border-top: 1px solid var(--line);
      font-size: 0.94rem;
    }

    .rank-cell {
      width: 48px;
      font-weight: 800;
      color: var(--muted);
    }

    .team-cell {
      font-weight: 800;
      color: var(--navy);
    }

    .leader-row {
      background: linear-gradient(180deg, rgba(217,39,46,0.04), rgba(217,39,46,0.01));
    }

    .leader-row .team-cell {
      color: var(--red);
    }

    .muted { color: var(--muted); }

    .pill {
      display: inline-block;
      padding: 4px 8px;
      background: #f3f5f7;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
    }

    .details-wrap {
      display: grid;
      gap: 14px;
    }

    .matchup-card {
      padding: 16px;
    }

    .matchup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .matchup-teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 8px 0;
    }

    .team-score {
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .team-score.winner { color: var(--navy); }
    .team-score.loser { color: var(--muted); }

    .team-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--navy);
    }

    .matchup-divider {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    details summary {
      cursor: pointer;
      list-style: none;
      color: var(--red);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 10px;
    }

    details summary::-webkit-details-marker {
      display: none;
    }

    .category-list {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .category-item {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      font-size: 0.83rem;
    }

    .category-name {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: center;
    }

    .player-list {
      padding: 0;
    }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      border-top: 1px solid var(--line);
    }

    .player-name {
      font-weight: 800;
      color: var(--navy);
    }

    .team-chip {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
    }

    select.card {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 12px;
      padding: 12px 44px 12px 14px;
      font-weight: 800;
      width: 100%;
      margin-bottom: 12px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) calc(50% - 2px),
        calc(100% - 13px) calc(50% - 2px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    @media (max-width: 900px) {
      .metrics-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .topbar-inner,
      .page-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .status-box {
        width: 100%;
      }

      .metrics-grid {
        grid-template-columns: 1fr;
      }

      .matchup-teams {
        grid-template-columns: 1fr;
      }

      .matchup-divider {
        display: none;
      }

      th, td {
        padding: 10px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">E</span>
        Dynasty Hub
      </div>

      <div class="status-box">
        <span class="status-label">Last updated</span>
        <span id="updated" class="status-value">Loading…</span>
      </div>
    </div>
  </div>

  <div class="page-shell">
    <header class="page-header">
      <div class="title-wrap">
        <span class="league-pill">League</span>
        <h1>Dynasty Hub</h1>
      </div>
    </header>

    <div id="metrics" class="metrics-grid"></div>

    <nav class="tabs-wrap">
      <div id="tabs"></div>
    </nav>

    <main id="view"></main>
  </div>

  <script>
    const D = {};
    let tab = "standings", team = null, names = {}, teams = {};
    const TABS = [
      ["standings", "Standings"],
      ["matchups", "Matchups"],
      ["rosters", "Rosters"],
      ["picks", "Picks"]
    ];

    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;"
    }[c]));

    async function load(n) {
      try {
        const r = await fetch(`data/${n}.json`, { cache: "no-cache" });
        if (!r.ok) throw 0;
        return await r.json();
      } catch (e) {
        return null;
      }
    }

    function buildNames(src) {
      const m = {};
      const add = (id, p) => {
        if (!id || p == null) return;
        if (typeof p === "string") { m[id] = p; return; }
        if (typeof p !== "object") return;

        let n = p.name || p.playerName || p.fullName || `${p.firstName || ""} ${p.lastName || ""}`.trim();
        if (!n) return;

        const i = n.indexOf(", ");
        if (i > 0) n = n.slice(i + 2) + " " + n.slice(0, i);

        m[id] = n;

        if (p.team && p.team !== "(N/A)") teams[id] = p.team;
      };

      if (!src) return m;
      const pi = Array.isArray(src) ? src : (src.players || src.playerIds || src);

      if (Array.isArray(pi)) {
        pi.forEach(p => add(p && (p.fantraxId || p.id || p.playerId), p));
      } else if (typeof pi === "object") {
        Object.entries(pi).forEach(([k, p]) => add((p && (p.fantraxId || p.id || p.playerId)) || k, p));
      }

      return m;
    }

    const teamName = id => (D.teamNames && D.teamNames[id]) || id;
    const empty = t => `<div class="card" style="padding:18px 20px;color:var(--muted);font-weight:700;">${t}</div>`;

    function renderMetrics() {
      const standings = D.standings || [];
      const leader = standings[0] || null;
      const avg = standings.length
        ? standings.reduce((total, t) => total + Number(t.pointsFor || 0), 0) / standings.length
        : 0;
      const topScore = standings.length
        ? Math.max(...standings.map(t => Number(t.pointsFor || 0)))
        : 0;

      document.getElementById("metrics").innerHTML = `
        <div class="metric-card">
          <span class="metric-label">League Size</span>
          <span class="metric-value">${standings.length || 0}</span>
          <span class="metric-note">teams</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Leader</span>
          <span class="metric-value">${leader ? esc(leader.teamName) : "—"}</span>
          <span class="metric-note">${leader ? `${leader.wins}-${leader.losses}-${leader.ties} record` : "Waiting for data"}</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Avg PF</span>
          <span class="metric-value">${avg ? avg.toFixed(1) : "0.0"}</span>
          <span class="metric-note">points per team</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Top Score</span>
          <span class="metric-value">${topScore.toFixed(1)}</span>
          <span class="metric-note">best weekly output</span>
        </div>
      `;
    }

    const V = {
      standings() {
        if (!D.standings) return empty("No standings data yet. Run the “Update Fantrax data” action.");
        const rows = [...D.standings]
          .sort((a, b) => a.rank - b.rank)
          .map(t => {
            const leader = t.rank === 1 ? "leader-row" : "";
            return `
              <tr class="${leader}">
                <td class="rank-cell">${t.rank}</td>
                <td class="team-cell">${esc(t.teamName)}</td>
                <td>${esc(t.wins)}-${esc(t.losses)}-${esc(t.ties)}</td>
                <td>${Number(t.winPercentage || 0).toFixed(3).replace(/^0/, "")}</td>
                <td>${esc(t.gamesBack)}</td>
                <td>${esc(t.pointsFor)}</td>
              </tr>
            `;
          }).join("");

        return `
          <div class="card table-card">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Team</th>
                  <th>W-L-T</th>
                  <th>Win%</th>
                  <th>GB</th>
                  <th>PF</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      },

      matchups() {
        const ms = D.matchups && D.matchups.matchups;
        if (!ms || !ms.length) return empty("No matchup data yet.");

        return `
          <div class="details-wrap">
            ${ms.map(m => {
              const a = m.away, h = m.home, aw = a.score > h.score;
              const cats = (m.categories || [])
                .filter(c => (c.away.display || c.home.display))
                .map(c => `
                  <div class="category-item">
                    <span>${esc(c.away.display ?? "–")}</span>
                    <span class="category-name">${esc(c.shortName)}<br><span class="muted">(${esc(c.group)})</span></span>
                    <span>${esc(c.home.display ?? "–")}</span>
                  </div>
                `).join("");

              return `
                <div class="card matchup-card">
                  <div class="matchup-header">
                    <span class="pill">Scoring Period ${D.matchups.period}</span>
                    <span class="muted">${aw ? "Winner" : "Result"}</span>
                  </div>

                  <div class="matchup-teams">
                    <div>
                      <div class="team-name">${esc(a.teamName)}</div>
                      <div class="team-score ${aw ? "winner" : "loser"}">${a.score}</div>
                    </div>
                    <div class="matchup-divider">@</div>
                    <div style="text-align:right;">
                      <div class="team-name">${esc(h.teamName)}</div>
                      <div class="team-score ${!aw ? "winner" : "loser"}">${h.score}</div>
                    </div>
                  </div>

                  <details>
                    <summary>Category breakdown</summary>
                    <div class="category-list">
                      ${cats || '<div class="muted">No category detail available.</div>'}
                    </div>
                  </details>
                </div>
              `;
            }).join("")}
          </div>
        `;
      },

      rosters() {
        const R = D.rosters && D.rosters.rosters;
        if (!R) return empty("No roster data yet.");

        const ids = Object.keys(R).sort((a, b) => R[a].teamName.localeCompare(R[b].teamName));
        if (!team || !R[team]) team = ids[0];

        const sel = ids.map(i => `
          <option value="${i}" ${i === team ? "selected" : ""}>${esc(R[i].teamName)}</option>
        `).join("");

        const groups = [
          ["ACTIVE", "Active"],
          ["RESERVE", "Reserve"],
          ["INJURED_RESERVE", "Injured reserve"],
          ["MINORS", "Minors"]
        ];

        const items = R[team].rosterItems;

        const body = groups.map(([k, l]) => {
          const list = items.filter(p => p.status === k);
          if (!list.length) return "";
          return `
            <div class="pill" style="display:block;width:fit-content;margin:14px 14px 0;padding:6px 10px;">${l} · ${list.length}</div>
            ${list.map(p => `
              <div class="player-row">
                <span>
                  <span class="player-name">${esc(names[p.id] || p.id)}</span>
                  ${teams[p.id] ? ` <span class="team-chip">${esc(teams[p.id])}</span>` : ""}
                </span>
                <span class="pill">${esc(p.status)}</span>
              </div>
            `).join("")}
          `;
        }).join("");

        const missing = items.filter(p => !names[p.id]).length;

        return `
          <select id="sel" class="card">${sel}</select>
          <div class="card" style="overflow:hidden;">
            ${body || '<div style="padding:18px;color:var(--muted);font-weight:700;">No roster entries.</div>'}
          </div>
          ${missing ? `<p class="muted" style="margin-top:10px;font-size:0.75rem;">${missing} player names not resolved yet (showing Fantrax IDs).</p>` : ""}
        `;
      }
    };

    V.picks = function () {
      if (!D.picks || !D.picks.length) return empty("No draft pick data yet.");

      const ids = Object.keys(D.teamNames).sort((a, b) => D.teamNames[a].localeCompare(D.teamNames[b]));
      if (!team || !D.teamNames[team]) team = ids[0];

      const sel = ids.map(i => `
        <option value="${i}" ${i === team ? "selected" : ""}>${esc(D.teamNames[i])}</option>
      `).join("");

      const mine = D.picks
        .filter(p => p.currentOwnerTeamId === team)
        .sort((a, b) => a.year - b.year || a.round - b.round);

      const years = [...new Set(mine.map(p => p.year))];
      const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : Math.min(n % 10, 4) % 4] || "th");

      const body = years.map(y => `
        <div class="pill" style="display:block;width:fit-content;margin:14px 14px 0;padding:6px 10px;">${y}</div>
        ${mine.filter(p => p.year === y).map(p => {
          const via = p.originalOwnerTeamId !== team;
          return `
            <div class="player-row">
              <span>${ord(p.round)} round</span>
              ${via ? `<span class="pill">via ${esc(teamName(p.originalOwnerTeamId))}</span>` : `<span class=\"pill\">held</span>`}
            </div>
          `;
        }).join("")}
      `).join("");

      const acquired = mine.filter(p => p.originalOwnerTeamId !== team).length;
      const traded = D.picks.filter(p => p.originalOwnerTeamId === team && p.currentOwnerTeamId !== team).length;

      return `
        <select id="sel" class="card">${sel}</select>
        <p class="muted" style="margin:0 0 12px;font-size:0.82rem;">
          ${mine.length} picks · ${acquired} acquired · ${traded} traded away
        </p>
        <div class="card" style="overflow:hidden;">
          ${body || '<div style="padding:18px;color:var(--muted);font-weight:700;">No picks.</div>'}
        </div>
      `;
    };

    function render() {
      renderMetrics();

      document.getElementById("tabs").innerHTML = TABS
        .map(([k, l]) => `<button class="tab ${k === tab ? "on" : ""}" data-k="${k}">${l}</button>`)
        .join("");

      document.getElementById("view").innerHTML = V[tab]();

      document.querySelectorAll(".tab").forEach(b => {
        b.onclick = () => {
          tab = b.dataset.k;
          location.hash = tab;
          render();
        };
      });

      const s = document.getElementById("sel");
      if (s) s.onchange = e => {
        team = e.target.value;
        render();
      };
    }

    (async () => {
      const [st, mu, ro, li, meta, dp] = await Promise.all([
        "standings",
        "matchups",
        "rosters",
        "playerIds",
        "meta",
        "draftPicks"
      ].map(load));

      D.picks = dp && dp.futureDraftPicks;
      D.standings = Array.isArray(st) ? st : (st && st.standings) || null;
      D.matchups = mu;
      D.rosters = ro;
      D.teamNames = {};

      (D.standings || []).forEach(t => D.teamNames[t.teamId] = t.teamName);

      names = buildNames(li);

      document.getElementById("updated").textContent =
        meta && meta.updatedAt
          ? new Date(meta.updatedAt).toLocaleString()
          : "Waiting for first data update";

      const h = location.hash.slice(1);
      if (TABS.some(t => t[0] === h)) tab = h;

      render();
    })();
  </script>
</body>
</html>
