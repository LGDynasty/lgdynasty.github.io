<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lollygaggers Dynasty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Courier+Prime:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--paper:#f3efe4;--card:#fbf8ef;--ink:#0c2340;--red:#e8710a;--line:#cfc6ad;--muted:#5d6577}
body{background:var(--paper);color:var(--ink);font-family:"Libre Baskerville",Georgia,serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(31,42,68,.06) 31px 32px)}
.slab{font-family:"Alfa Slab One",Georgia,serif;letter-spacing:.02em}
.mono{font-family:"Courier Prime","Courier New",monospace}
.lbl{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--line)}
.rule{border-top:3px double var(--ink)}
.row{border-top:1px dashed var(--line)}
.tab{padding:.45rem .8rem;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;border-bottom:3px solid transparent;color:var(--muted)}
.tab.on{color:var(--ink);border-bottom-color:var(--red);font-weight:700}
.lnk{color:var(--ink);text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.pill{font-size:.65rem;padding:.05rem .4rem;border:1px solid var(--ink);border-radius:2px;letter-spacing:.06em}
.stamp{color:var(--red);border:2px solid var(--red);padding:.05rem .4rem;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-3deg);display:inline-block}
th{font-weight:400;text-align:left;padding:.5rem .6rem}
td{padding:.55rem .6rem;font-size:.88rem}
summary{cursor:pointer}
</style>
</head>
<body>
<div class="max-w-3xl mx-auto px-4 pb-12">
  <header class="mt-4 mb-3 py-5 px-4 text-center" style="background:var(--ink);color:#fff;border-bottom:5px solid var(--red);border-radius:4px">
    <div id="emblem" class="flex justify-center"></div>
    <h1 id="lname" class="slab text-3xl mt-2"></h1>
    <p id="lsub" class="mt-1" style="font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#f5b77a"></p>
    <p id="updated" class="mono text-xs mt-2" style="color:#aab4c8">Loading…</p>
  </header>
  <nav id="tabs" class="flex sm:justify-center overflow-x-auto"></nav>
  <div class="rule mb-4"></div>
  <main id="view"></main>
</div>
<script>
// ---- Customize here ----
const LOGO = `<svg viewBox="0 0 100 100" width="76" height="76" xmlns="http://www.w3.org/2000/svg" aria-label="League logo"><circle cx="50" cy="50" r="46" fill="#0c2340" stroke="#e8710a" stroke-width="5"/><circle cx="50" cy="50" r="39" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M27 24H57V31H48V65H67V53H75V77H27V70H37V31H27Z" fill="#fff"/></svg>`;
const CFG = { name: "Lollygaggers Dynasty", sub: "Baseball Hub" };
// Team logos: put an image named after each team's code in the repo's /logos folder (e.g. logos/POR.jpg).
// The league logo is logos/league.jpg. Missing files are skipped, so you can add them a few at a time.
const LOGO_EXT = "jpg"; // change to "png" if you switch file types
const TEAM_CODES = {
  "tmbonzbmmhspuuiy":"POR", "exu2oyc7mhspuuiy":"WSW", "as3cegazmhspuuix":"FEN", "zaz8plfhmhspuuiy":"NPL",
  "09956kirmhspuuix":"SEL", "agj706lvmhspuuix":"VAL", "oers8dk6mhspuuix":"AZA", "n41h8me0mk8wumhx":"ARS",
  "beaf9cbomhspuuiy":"STP", "wg86uwvdmhspuuix":"SWK", "fld7b6vqmhspuuiy":"BXB", "409tbv2xmhspuuix":"CHG",
  "l1dz6rrjmhspuuiy":"JVL", "5x8tg8k4mlfsxfaa":"SSM"
};
// Trade tracker seasons: one CSV per season in /data. Add a line each year;
// the last one is shown first and is the one the Google Sheet refreshes.
const SEASONS = [
  { label: "2025", file: "trades-2025.csv" },
  { label: "2026", file: "trades-2026.csv" },
  { label: "2027", file: "trades.csv" }
];
// ------------------------
const D = {}; let names = {}, teams = {}, pos = {}, fSeason = SEASONS[SEASONS.length-1].label, fTeam = "";
const TABS = [["home","Home"],["standings","Standings"],["power","Power"],["matchups","Matchups"],["teams","Teams"],["trades","Trades"]];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tn = id => D.tn[id] || id;
const logo = (id, px = 20) => TEAM_CODES[id] ? `<img src="logos/${TEAM_CODES[id]}.${LOGO_EXT}" alt="" width="${px}" height="${px}" style="display:inline-block;vertical-align:middle;margin-right:6px;object-fit:contain;border-radius:4px" onerror="this.remove()">` : "";
const lnk = id => `${logo(id)}<a class="lnk" href="#team-${id}">${esc(tn(id))}</a>`;
const ord = n => n + (["th","st","nd","rd"][(n%100>10&&n%100<14)?0:Math.min(n%10,4)%4] || "th");
const empty = t => `<div class="card p-4 text-sm" style="color:var(--muted)">${t}</div>`;
const loadText = async n => { try { const r = await fetch(`data/${n}`,{cache:"no-cache"}); if(!r.ok) throw 0; return await r.text(); } catch(e){ return null; } };
const load = async n => { try { const r = await fetch(`data/${n}.json`,{cache:"no-cache"}); if(!r.ok) throw 0; return await r.json(); } catch(e){ return null; } };

function buildNames(src){
  const m = {}; if(!src) return m;
  const add = (id,p) => { if(!id || !p || typeof p!=="object") return;
    let n = p.name || p.playerName || p.fullName; if(!n) return;
    const i = n.indexOf(", "); if(i>0) n = n.slice(i+2)+" "+n.slice(0,i);
    m[id] = n; if(p.position) pos[id] = p.position; if(p.team && p.team!=="(N/A)") teams[id] = p.team; };
  const pi = Array.isArray(src) ? src : (src.players || src);
  if(Array.isArray(pi)) pi.forEach(p => add(p&&(p.fantraxId||p.id), p));
  else Object.entries(pi).forEach(([k,p]) => add((p&&p.fantraxId)||k, p));
  return m;
}
const stat = (l,v,s) => `<div class="card p-4"><div class="lbl">${l}</div><div class="slab text-xl mt-1">${v}</div><div class="text-xs mt-1" style="color:var(--muted)">${s||""}</div></div>`;

const V = {
  home(){
    const S = D.standings; if(!S) return empty("No data yet. Run the “Update Fantrax data” action.");
    const lead = [...S].sort((a,b)=>a.rank-b.rank)[0];
    const pf = [...S].sort((a,b)=>b.totalPointsFor-a.totalPointsFor)[0];
    const ms = (D.matchups && D.matchups.matchups) || [];
    let close = null; ms.forEach(m => { const d = Math.abs(m.away.score-m.home.score); if(!close || d<close.d) close = {m,d}; });
    const firsts = {}; (D.picks||[]).filter(p=>p.round===1).forEach(p => firsts[p.currentOwnerTeamId] = (firsts[p.currentOwnerTeamId]||0)+1);
    const hoard = Object.entries(firsts).sort((a,b)=>b[1]-a[1])[0];
    const moved = (D.picks||[]).filter(p=>p.currentOwnerTeamId!==p.originalOwnerTeamId).length;
    const sb = ms.map(m => { const aw = m.away.score>m.home.score;
      return `<div class="row py-2 text-sm"><div class="flex justify-between ${aw?"font-bold":""}"><span>${lnk(m.away.teamId)}</span><span class="mono">${m.away.score}</span></div><div class="flex justify-between ${!aw?"font-bold":""}"><span>${lnk(m.home.teamId)}</span><span class="mono">${m.home.score}</span></div></div>`; }).join("");
    return `<div class="grid grid-cols-2 gap-3">
      ${stat("League leader", esc(lead.teamName), lead.points)}
      ${stat("Points leader", esc(pf.teamName), Math.round(pf.totalPointsFor).toLocaleString()+" pts")}
      ${hoard ? stat("First-round hoard", esc(tn(hoard[0])), hoard[1]+" first-round picks") : ""}
      ${stat("Picks on the move", moved, "held by a team that didn’t originate them")}
    </div>
    ${ms.length ? `<div class="card p-4 mt-4"><div class="flex justify-between items-center"><div class="lbl">This week’s scoreboard</div><span class="stamp">Period ${D.matchups.period}</span></div>${sb}
      ${close ? `<p class="text-xs mt-3" style="color:var(--muted)">Closest game: ${esc(close.m.away.teamName)} vs ${esc(close.m.home.teamName)}, ${close.d.toFixed(1)} apart.</p>`:""}</div>` : ""}`;
  },
  standings(){
    if(!D.standings) return empty("No standings data yet.");
    const rows = [...D.standings].sort((a,b)=>a.rank-b.rank).map(t =>
      `<tr class="row"><td class="mono">${t.rank===1?"★":t.rank}</td><td>${lnk(t.teamId)}</td><td class="mono">${esc(t.points)}</td><td class="mono">${t.winPercentage.toFixed(3).replace(/^0/,"")}</td><td class="mono">${t.gamesBack||"—"}</td><td class="mono">${Math.round(t.totalPointsFor).toLocaleString()}</td></tr>`).join("");
    return `<div class="card overflow-x-auto"><table class="w-full"><tr class="lbl"><th>#</th><th>Club</th><th>W-L-T</th><th>Pct</th><th>GB</th><th>PF</th></tr>${rows}</table></div>`;
  },
  matchups(){
    const ms = D.matchups && D.matchups.matchups; if(!ms || !ms.length) return empty("No matchup data yet.");
    return `<p class="lbl mb-2">Scoring period ${D.matchups.period}</p>` + ms.map(m => {
      const a=m.away, h=m.home, aw=a.score>h.score;
      const cats = (m.categories||[]).filter(c=>c.away.display||c.home.display).map(c =>
        `<div class="flex justify-between text-xs py-1 row mono"><span>${esc(c.away.display??"–")}</span><span style="color:var(--muted)">${esc(c.shortName)}</span><span>${esc(c.home.display??"–")}</span></div>`).join("");
      return `<div class="card p-4 mb-3"><div class="flex justify-between ${aw?"font-bold":""}"><span>${lnk(a.teamId)}</span><span class="mono">${a.score}</span></div>
        <div class="flex justify-between mt-1 ${!aw?"font-bold":""}"><span>${lnk(h.teamId)}</span><span class="mono">${h.score}</span></div>
        <details class="mt-2"><summary class="lbl">Box score</summary><div class="mt-2">${cats}</div></details></div>`;
    }).join("");
  },
  teams(){
    if(!D.standings) return empty("No data yet.");
    return `<div class="grid grid-cols-2 gap-3">` + [...D.standings].sort((a,b)=>a.teamName.localeCompare(b.teamName)).map(t =>
      `<a href="#team-${t.teamId}" class="card p-3 block">${logo(t.teamId,44)}<div class="lbl mt-1">Rank ${t.rank}</div><div class="font-bold text-sm mt-1">${esc(t.teamName)}</div><div class="mono text-xs mt-1">${esc(t.points)}</div></a>`).join("") + `</div>`;
  },
  team(id){
    const t = (D.standings||[]).find(x=>x.teamId===id); if(!t) return empty("Team not found.");
    const R = D.rosters && D.rosters.rosters && D.rosters.rosters[id];
    const groups = [["ACTIVE","Active roster"],["RESERVE","Reserve"],["INJURED_RESERVE","Injured list"],["MINORS","Minors / prospects"]];
    const roster = R ? groups.map(([k,l]) => { const list = R.rosterItems.filter(p=>p.status===k); if(!list.length) return "";
      return `<div class="lbl px-4 py-2 row">${l} · ${list.length}</div>` + list.map(p =>
        `<div class="px-4 py-2 flex justify-between items-center row text-sm"><span>${esc(names[p.id]||p.id)}${teams[p.id]?` <span class="mono text-xs" style="color:var(--muted)">${esc(teams[p.id])}</span>`:""}</span><span class="pill">${esc(p.position)}</span></div>`).join(""); }).join("") : `<div class="p-4 text-sm">No roster data.</div>`;
    const mine = (D.picks||[]).filter(p=>p.currentOwnerTeamId===id).sort((a,b)=>a.year-b.year||a.round-b.round);
    const years = [...new Set(mine.map(p=>p.year))];
    const picks = years.map(y => `<div class="lbl px-4 py-2 row">${y}</div>` + mine.filter(p=>p.year===y).map(p =>
      `<div class="px-4 py-2 flex justify-between row text-sm"><span>${ord(p.round)} round</span>${p.originalOwnerTeamId!==id?`<span class="pill">via ${esc(tn(p.originalOwnerTeamId))}</span>`:`<span class="mono text-xs" style="color:var(--muted)">own</span>`}</div>`).join("")).join("");
    const m = ((D.matchups&&D.matchups.matchups)||[]).find(x=>x.away.teamId===id||x.home.teamId===id);
    const opp = m ? (m.away.teamId===id ? m.home : m.away) : null, me = m ? (m.away.teamId===id ? m.away : m.home) : null;
    return `<a href="#teams" class="lbl">← All clubs</a>
      <div class="flex items-center mt-2">${logo(id,56)}<h2 class="slab text-2xl">${esc(t.teamName)}</h2></div>
      <p class="mono text-sm mt-1">Rank ${t.rank} · ${esc(t.points)} · ${Math.round(t.totalPointsFor).toLocaleString()} PF</p>
      ${m ? `<p class="text-sm mt-2">This week: <b class="mono">${me.score}</b> vs ${lnk(opp.teamId)} <b class="mono">${opp.score}</b></p>`:""}
      <div class="card mt-4 overflow-hidden"><div class="slab px-4 py-3">Roster</div>${roster}</div>
      <div class="card mt-4 overflow-hidden"><div class="slab px-4 py-3">Draft picks</div>${picks || `<div class="p-4 text-sm">No picks.</div>`}</div>`;
  }
};
function parseCSV(t){
  const rows = []; let r = [], c = "", q = false;
  for(let i=0;i<t.length;i++){ const ch = t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ c+='"'; i++; } else q=false; } else c+=ch; }
    else if(ch==='"') q = true;
    else if(ch===','){ r.push(c); c=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&t[i+1]==="\n") i++; r.push(c); rows.push(r); r=[]; c=""; }
    else c+=ch; }
  if(c||r.length){ r.push(c); rows.push(r); }
  return rows.filter(x => x.some(v => v.trim()));
}
function parseTrades(txt){
  if(!txt) return null;
  const rows = parseCSV(txt); if(rows.length<2) return [];
  const h = rows[0].map(x => x.trim().toLowerCase());
  const iN = h.indexOf("#"), iD = h.indexOf("date");
  const starts = ["team a","team b","team c"].map(k => h.indexOf(k)).filter(i => i>=0);
  const split = v => (v||"").split(/,\s*/).map(x=>x.trim()).filter(Boolean);
  const isPick = x => /\bRD\b/i.test(x), isCash = x => /^\$/.test(x);
  return rows.slice(1).map((r,ri) => {
    const parts = starts.map(i => {
      const team = (r[i]||"").trim(); if(!team) return null;
      const raw = split(r[i+2]), mlb = split(r[i+1]), pos = split(r[i+3]);
      const pl = raw.filter(x => !isPick(x) && !isCash(x));
      // MLB team / position columns line up with players only; skip them if the counts don't match
      const items = raw.map(x => {
        if(isPick(x)) return {text:x, type:"pick"};
        if(isCash(x)) return {text:x, type:"cash"};
        const k = pl.indexOf(x);
        return {text:x, type:"player", mlb: mlb.length===pl.length ? mlb[k] : "", pos: pos.length===pl.length ? pos[k] : ""};
      });
      return {team, items};
    }).filter(Boolean);
    return {n: parseInt(r[iN],10) || ri+1, date: (r[iD]||"").trim(), parts};
  }).filter(t => t.parts.length >= 2);
}
const cleanName = n => n.replace(/^[A-Z]{2,4}\s+/,"").trim();
const toks = n => n.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w => w && w!=="the");
function canon(raw){
  const name = cleanName(raw), a = toks(name);
  let best = null, score = 0;
  (D.standings||[]).forEach(t => { const b = toks(t.teamName); const sh = a.filter(w => b.includes(w)).length; if(sh>score){ score = sh; best = t; } });
  return best && score >= Math.min(a.length,2) ? {name:best.teamName, id:best.teamId} : {name, id:null};
}
const itemHtml = i => i.type==="pick" ? `<li><span class="pill">PICK</span> ${esc(i.text)}</li>`
  : i.type==="cash" ? `<li><span class="pill">CASH</span> ${esc(i.text)}</li>`
  : `<li>${esc(i.text)}${i.mlb?` <span class="mono text-xs" style="color:var(--muted)">${esc(i.mlb)}</span>`:""}${i.pos?` <span class="pill">${esc(i.pos)}</span>`:""}</li>`;
V.trades = function(){
  const labels = SEASONS.map(x => x.label);
  if(!labels.includes(fSeason)) fSeason = labels[labels.length-1];
  const T = D.trades[fSeason];
  const head = `<div class="flex justify-center mb-3">` + labels.map(l => `<button data-season="${esc(l)}" class="tab ${l===fSeason?"on":""}">${esc(l)}</button>`).join("") + `</div>`;
  if(!T || !T.length) return head + empty(`No trades logged for ${esc(fSeason)} yet. Expected <span class="mono">data/${SEASONS.find(x=>x.label===fSeason).file}</span>.`);
  const C = T.map(t => ({...t, parts: t.parts.map(p => ({...p, c: canon(p.team)}))}));
  const tms = [...new Set(C.flatMap(t => t.parts.map(p => p.c.name)))].sort();
  if(fTeam && !tms.includes(fTeam)) fTeam = "";
  const list = C.filter(t => !fTeam || t.parts.some(p => p.c.name===fTeam)).sort((a,b) => b.n-a.n);
  const opts = `<option value="">All teams</option>` + tms.map(v => `<option ${v===fTeam?"selected":""}>${esc(v)}</option>`).join("");
  return head + `<select id="fT" class="card w-full p-2 text-sm mb-3" style="color:var(--ink)">${opts}</select>
  <p class="lbl mb-2">${list.length} trade${list.length===1?"":"s"}</p>` + list.map(t =>
    `<div class="card p-4 mb-3"><div class="flex justify-between items-center"><span class="lbl">Trade #${t.n}</span><span class="mono text-xs" style="color:var(--muted)">${esc(t.date)}</span></div>
    <div class="grid ${t.parts.length===2?"grid-cols-2":"grid-cols-1"} gap-4 mt-3 text-sm">${t.parts.map(p =>
      `<div><div class="font-bold">${p.c.id?lnk(p.c.id):esc(p.c.name)}</div><div class="lbl mt-1">Receives</div><ul class="mt-1 space-y-1">${p.items.map(itemHtml).join("") || "<li>—</li>"}</ul></div>`).join("")}</div></div>`).join("");
};
V.power = function(){
  const S = D.standings; if(!S) return empty("No data yet.");
  const P = (D.pscores && D.pscores.periods) || {};
  const done = Object.keys(P).map(Number).sort((a,b)=>a-b);
  const startList = D.pstart && D.pstart.teams ? [...D.pstart.teams].sort((a,b)=>a.rank-b.rank).map(t => ({id:t.teamId, rec:t.record}))
    : [...S].sort((a,b)=>a.rank-b.rank).map(t => ({id:t.teamId, rec:t.points}));
  const agg = upto => { const m = {};
    done.filter(p => p<=upto).forEach(p => P[p].forEach(g => [[g.a,g.as,g.hs],[g.h,g.hs,g.as]].forEach(([id,f,a]) => { const x = m[id] || (m[id] = {pf:0,pa:0}); x.pf += f; x.pa += a; })));
    return Object.entries(m).map(([id,x]) => ({id, pf:x.pf, pa:x.pa, s: (x.pf*x.pf + x.pa*x.pa) ? x.pf*x.pf/(x.pf*x.pf + x.pa*x.pa) : .5})).sort((a,b)=>b.s-a.s);
  };
  const arrow = d => d>0 ? `<span style="color:#2e7d32">▲${d}</span>` : d<0 ? `<span style="color:var(--red)">▼${-d}</span>` : `<span style="color:var(--muted)">—</span>`;
  const note = t => `<p class="text-xs mt-3 italic" style="color:var(--muted)">${t}</p>`;
  if(!done.length){
    const label = D.pstart ? D.pstart.label : "Current Fantrax standings";
    return `<div class="card overflow-x-auto"><div class="px-4 py-3"><div class="lbl">Starting point</div><div class="slab text-lg">${esc(label)}</div></div><table class="w-full">` +
      startList.map((t,i) => `<tr class="row"><td class="mono">${i+1}</td><td>${lnk(t.id)}</td><td class="mono text-right text-xs" style="color:var(--muted)">${esc(t.rec||"")}</td></tr>`).join("") + `</table></div>` +
      note("These rankings switch to the points formula once the 2027 season has a finished scoring period.");
  }
  const cur = agg(done[done.length-1]);
  const prev = {};
  (done.length>1 ? agg(done[done.length-2]).map(x=>x.id) : startList.map(x=>x.id)).forEach((id,i) => prev[id] = i+1);
  return `<p class="lbl mb-2">Through scoring period ${done[done.length-1]}</p><div class="card overflow-x-auto"><table class="w-full"><tr class="lbl"><th>#</th><th></th><th>Club</th><th>Score</th></tr>` +
    cur.map((t,i) => `<tr class="row"><td class="mono">${i+1}</td><td class="mono text-xs">${prev[t.id] ? arrow(prev[t.id]-(i+1)) : ""}</td><td>${lnk(t.id)}<div class="mono text-xs" style="color:var(--muted)">PF ${Math.round(t.pf).toLocaleString()} · PA ${Math.round(t.pa).toLocaleString()}</div></td><td class="mono">${t.s.toFixed(3).replace(/^0/,"")}</td></tr>`).join("") + `</table></div>` +
    note("Score = PF² ÷ (PF² + PA²) over finished scoring periods. Arrows show movement since the previous period.");
};
function route(keep){
  const h = location.hash.slice(1) || "home", isTeam = h.startsWith("team-");
  const cur = isTeam ? "teams" : (TABS.some(t=>t[0]===h) ? h : "home");
  document.getElementById("tabs").innerHTML = TABS.map(([k,l]) => `<a href="#${k}" class="tab ${k===cur?"on":""}">${l}</a>`).join("");
  document.getElementById("view").innerHTML = isTeam ? V.team(h.slice(5)) : V[cur]();
  if(!keep) window.scrollTo(0,0);
  document.querySelectorAll("[data-season]").forEach(b => b.onclick = () => { fSeason = b.dataset.season; fTeam = ""; route(true); });
  const ft = document.getElementById("fT");
  if(ft) ft.onchange = e => { fTeam = e.target.value; route(true); };
}
(async () => {
  document.title = CFG.name;
  const em = document.getElementById("emblem"), fav = document.createElement("link");
  fav.rel = "icon"; document.head.appendChild(fav);
  em.innerHTML = LOGO; fav.href = "data:image/svg+xml," + encodeURIComponent(LOGO);
  const lg = new Image(); lg.alt = CFG.name; lg.style.cssText = "height:84px;width:auto;max-width:220px;object-fit:contain;background:#fff;border-radius:10px;padding:5px";
  lg.onload = () => { em.innerHTML = ""; em.appendChild(lg); fav.href = lg.src; };
  lg.src = `logos/league.${LOGO_EXT}`;
  document.getElementById("lname").textContent = CFG.name;
  document.getElementById("lsub").textContent = CFG.sub;
  const [st,mu,ro,pi,meta,dp,ps,psc,...trs] = await Promise.all(["standings","matchups","rosters","playerIds","meta","draftPicks","power-start","period-scores"].map(load).concat(SEASONS.map(x => loadText(x.file))));
  D.standings = Array.isArray(st) ? st : (st && st.standings) || null;
  D.matchups = mu; D.rosters = ro; D.picks = dp && dp.futureDraftPicks; D.pstart = ps; D.pscores = psc; D.trades = {}; SEASONS.forEach((x,i) => D.trades[x.label] = parseTrades(trs[i]));
  D.tn = {}; (D.standings||[]).forEach(t => D.tn[t.teamId] = t.teamName);
  names = buildNames(pi);
  document.getElementById("updated").textContent = meta && meta.updatedAt ? "Updated " + new Date(meta.updatedAt).toLocaleString() : "Waiting for first data update";
  window.addEventListener("hashchange", () => route()); route();
})();
</script>
